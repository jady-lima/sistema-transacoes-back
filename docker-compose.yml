services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sistema-transacoes-api

    ports:
      - "8000:8000"

    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sistema_transacoes}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "composer install --no-interaction &&
             php artisan migrate --seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgres:17-alpine

    container_name: sistema-transacoes-postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${DB_DATABASE:-sistema_transacoes}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-sistema_transacoes}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  vendor_data: